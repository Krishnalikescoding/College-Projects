<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intelligent Library Search Agent</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script
      type="text/javascript"
      src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"
    ></script>
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <h2>Library AI Agent</h2>

        <label>Search Book:</label>
        <input
          type="text"
          id="searchInput"
          placeholder="Enter title or author..."
        />
        <button onclick="searchBook()">Find Book</button>
        <p id="searchResult"></p>
        <button onclick="addToCollection()">Add to Collection</button>

        <hr />

        <label>Collection List:</label>
        <ul id="collectionList"></ul>
        <button onclick="clearCollection()">Clear List</button>

        <hr />

        <label>Algorithm (Single Book):</label>
        <select id="algoSelect">
          <option value="A*">A* Search</option>
          <option value="BFS">BFS</option>
          <option value="DFS">DFS</option>
        </select>

        <button onclick="navigateSingle()" class="primary-btn">
          Navigate Single Book
        </button>
        <label>Optimize For:</label>
        <select id="optimizeSelect">
          <option value="distance">Shortest Distance</option>
          <option value="time">Fastest Time (Crowded Aisles)</option>
        </select>

        <label>Time/Cost Limit:</label>
        <input type="number" id="timeLimit" value="100" />
        <button onclick="navigateMulti()" class="success-btn">
          Plan Multi-Book Route
        </button>

        <div id="results">
          <h3>Results:</h3>
          <p id="resultText">Waiting for action...</p>
        </div>
      </div>

      <div class="main-content">
        <div id="networkMap"></div>
      </div>
    </div>
    <script src="/static/script.js"></script>
  </body>
</html>
